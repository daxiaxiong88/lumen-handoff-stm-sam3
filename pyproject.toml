[project]
name = "lumen"
version = "0.1.0"
description = "Lumen: Scientific Image Self-Supervised Learning Framework"
readme = "README.md"
requires-python = ">=3.10"
# NOTE: the Lumen framework code is MIT, but the default EUPE encoder (vendored
# under vendor/EUPE) and its published weights are under the FAIR Noncommercial
# Research License. Commercial deployments must swap to a permissively-licensed
# encoder (e.g. DINOv3 under its own terms). See README "Licensing".
license = {text = "MIT"}
authors = [
    {name = "Lumen Team"}
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "pillow>=9.5",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "tensorboard>=2.13",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "einops>=0.7",
    "timm>=0.9",
    "supervision>=0.28.0",
    "sqlalchemy>=2.0.49",
    "typer>=0.12",
    "pydantic>=2.0",
]

[project.scripts]
lumen = "lumen.cli:main"
lumen-download-models = "lumen.models.download:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "black>=23.7",
    "ruff>=0.0.285",
    "mypy>=1.5",
    "pre-commit>=3.3",
    "requests-mock>=1.11",
    "httpx>=0.25",
]
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
roboflow = [
    "roboflow>=1.1.0",
    "scikit-image>=0.21",
]
hyperdata = [
    "hyperdata>=0.1.0",
    "minio>=7.2",
]
transformers = [
    "transformers>=4.30",
    "modelscope>=1.4",
]
labelstudio = [
    "label-studio-sdk>=1.0",
]
vision_banana = [
    # FLUX.2-klein-4B needs Flux2KleinPipeline; install the git build:
    #   pip install git+https://github.com/huggingface/diffusers.git
    "diffusers>=0.35",
    "transformers>=4.30",
    "accelerate>=0.30",
    "peft>=0.10",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = [
    "lumen.data.roboflow",
    "modelscope.*",
    "roboflow.*",
    "sam3.*",
    "tqdm",
    "tqdm.*",
    "hyperdata.*",
    "hyperspy.*",
    "pycocotools.*",
    "sklearn.*",
    "cv2.*",
    "supervision.*",
    "scipy.*",
    "skimage.*",
    "einops.*",
    "timm.*",
    "eupe.*",
    "tensorboard.*",
    "matplotlib.*",
    "transformers.*",
    "diffusers.*",
    "huggingface_hub.*",
    "peft.*",
    "label_studio_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tifffile"]
follow_imports = "skip"

# The annotation store uses classic SQLAlchemy declarative_base()/Column style,
# which mypy cannot model without the Mapped[] annotations (a larger refactor).
# Silence only the ORM-shape false positives here rather than repo-wide.
[[tool.mypy.overrides]]
module = ["lumen.annotation.store"]
disable_error_code = ["assignment", "misc", "valid-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ""
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "types-pyyaml>=6.0.12.20250915",
    "types-tqdm>=4.67.3.20260205",
]
