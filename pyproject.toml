[project]
name = "lumen"
version = "0.1.0"
description = "Lumen: Scientific Image Self-Supervised Learning Framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Lumen Team"}
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "pillow>=9.5",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "tensorboard>=2.13",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "einops>=0.7",
    "timm>=0.9",
    "supervision>=0.28.0",
    "roboflow>=1.1.0",
    "minio>=7.2.20",
    "pylance>=0.20.0",
    "transformers>=4.57.6",
    "modelscope>=1.36.3",
    "sqlalchemy>=2.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.0.285",
    "mypy>=1.5",
    "pre-commit>=3.3",
]
roboflow = [
    "scikit-image>=0.21",
]
hyperdata = [
    "hyperdata>=0.1.0",
]
transformers = [
    "transformers>=4.30",
    "modelscope>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = [
    "lumen.data.roboflow",
    "hyperdata.*",
    "hyperspy.*",
    "pycocotools.*",
    "sklearn.*",
    "cv2.*",
    "supervision.*",
    "scipy.*",
    "skimage.*",
    "einops.*",
    "timm.*",
    "eupe.*",
    "tensorboard.*",
    "matplotlib.*",
    "transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tifffile"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ""

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "types-pyyaml>=6.0.12.20250915",
    "types-tqdm>=4.67.3.20260205",
]
